[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # La caché de Turbopack (.next/cache) guarda los valores de las variables de
  # entorno para acelerar recompilaciones. No se publica, pero el escáner de
  # secretos de Netlify la revisa y falla el build por AUTH_SECRET. Solo se
  # excluye esa carpeta; el resto del output se sigue escaneando.
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**,.next/cache/**"

# SYNEXA Showroom como /servicios-y-precios: definir la variable de entorno
# SHOWROOM_URL (URL del sitio del Showroom en Netlify) y next.config.mjs
# reenvía /servicios-y-precios, /demos y /assets. Sin la variable, el sitio
# sigue sirviendo su propia página. Ver synexa-showroom/docs/arquitectura/.
